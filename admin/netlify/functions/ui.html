<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website manager — Arfa Chemicals</title>
<style>
  :root{--blue:#0a4a8f;--blue-2:#08396e;--green:#1e9e4a;--ink:#10202e;--soft:#52677a;--line:#dfe9e2;--bg:#f0f5f1;--card:#fff;--red:#cf4141;--amber:#9a6b00}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
  h1,h2,h3,h4{margin:0 0 6px;line-height:1.25}
  .hidden{display:none!important}
  .wrap{max-width:960px;margin:0 auto;padding:18px 16px 90px}
  button{font:600 14px inherit;cursor:pointer;border-radius:10px;padding:10px 18px;border:1px solid transparent;transition:.15s}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn{background:var(--green);color:#fff}
  .btn:hover:not(:disabled){background:#147f38}
  .btn.blue{background:var(--blue)}
  .btn.blue:hover:not(:disabled){background:var(--blue-2)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--soft)}
  .btn.ghost:hover{border-color:#b6ccc0;color:var(--ink)}
  .btn.red{background:#fff;color:var(--red);border-color:#eccaca}
  .btn.red:hover{background:#fdf2f2}
  .btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
  input,select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(30,158,74,.13)}
  textarea{resize:vertical;min-height:80px;font-size:14.5px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--soft);margin-bottom:5px}
  .field .hint{display:block;font-size:12px;color:#83959f;font-weight:400;margin-top:3px;line-height:1.4}
  .group{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:13px;background:#fbfdfb}
  .group>h3{font-size:13.5px;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .gdot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 4px rgba(6,41,77,.05)}
  .panel>h2{font-size:17px;color:var(--blue);margin-bottom:3px}
  .panel .desc{color:var(--soft);font-size:13.5px;margin:0 0 15px}
  .muted{color:var(--soft);font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
  .check{display:flex;align-items:center;gap:10px;padding:4px 0}
  .check input{width:auto;height:18px;width:18px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(6,41,77,.06)}
  .top .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--blue);font-size:16px}
  .bmark{width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0}
  .top .spacer{flex:1}
  .dirty-chip{display:none;align-items:center;gap:7px;background:#fff4d8;color:#8a6100;border:1px solid #ecd98f;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700}
  .dirty-chip.show{display:inline-flex}
  .dotp{width:8px;height:8px;border-radius:50%;background:#d9a400;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #save-main{font-size:14.5px;padding:10px 20px;box-shadow:0 4px 14px rgba(30,158,74,.35)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 16px 0;max-width:960px;margin:0 auto}
  .tabs button{background:#fff;border:1px solid var(--line);color:var(--soft);border-radius:12px;padding:9px 16px}
  .tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  #msg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;box-shadow:0 12px 34px rgba(0,0,0,.3);z-index:60;display:none;max-width:92vw;text-align:center}
  #msg.show{display:block}
  #msg.err{background:var(--red)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 2px;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .thumb{width:52px;height:52px;border-radius:11px;object-fit:cover;border:1px solid var(--line);background:#f2f7f3;flex-shrink:0}
  .row .thumb-ph{width:52px;height:52px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:var(--blue);background:#e7f4ec;font-size:17px;flex-shrink:0}
  .row .name{flex:1;min-width:180px;font-weight:600;font-size:14.5px}
  .row .sub{color:var(--soft);font-size:12.5px;display:block;font-weight:400}
  .row .acts{display:flex;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eef4fb;border:1px solid #d6e4f5;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
  .chip a{color:#b45309;text-decoration:none;font-weight:800;font-size:14px}
  .upbox{border:2px dashed #c5d6cb;border-radius:14px;padding:18px;text-align:center;background:#fbfdfb}
  .upbox img{max-height:190px;max-width:100%;border-radius:10px;margin:0 auto 12px;display:block;object-fit:contain;background:#fff}
  .upbox .muted{display:block;margin-top:10px}
  .howto{background:#eef6f1;border:1px solid #d5e8dc;border-radius:12px;padding:12px 16px;font-size:13.5px;color:#1c5233;margin-bottom:16px;line-height:1.65}
  .howto b{white-space:nowrap}
  #login{max-width:420px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:38px;box-shadow:0 20px 60px rgba(6,41,77,.14)}
  .lhead{width:60px;height:60px;border-radius:17px;background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;margin-bottom:18px}
  #login h1{font-size:21px;color:var(--blue)}
  #login p{color:var(--soft);margin:0 0 20px;font-size:14px}
  #login .btn{width:100%;padding:12px}
  .adv-link{text-align:center;padding:18px 0;color:#8a99a5;font-size:13px}
  .adv-link a{color:var(--soft);cursor:pointer;text-decoration:underline}
  body:not(.advanced) .adv-only{display:none!important}
  .note-pill{display:inline-flex;align-items:center;gap:6px;background:#eef4fb;border:1px solid #d9e6f5;color:var(--blue);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}
    input,select,textarea{font-size:16px} /* prevents iOS zoom-on-focus */
    .btn.small{padding:8px 12px}
    button:not(.small){min-height:44px}}
</style>
</head>
<body>

<div id="login">
  <div class="lhead">AC</div>
  <h1>Arfa Chemicals<br>website manager</h1>
  <p>Use this page to change your website text, products and photos. Ask the business owner for the password.</p>
  <div class="field">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
  </div>
  <button class="btn" id="unlock">Open the manager</button>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="brand"><span class="bmark">AC</span>Website manager</div>
    <div class="spacer"></div>
    <span class="dirty-chip" id="dirty-chip"><span class="dotp"></span>Unsaved changes</span>
    <button class="btn" id="save-main">Save changes</button>
    <button class="btn small ghost adv-only" id="btn-reload">Reload</button>
    <button class="btn small red" id="btn-logout">Log out</button>
  </div>
  <div class="tabs">
    <button data-tab="home" class="on">Home page</button>
    <button data-tab="about">About page</button>
    <button data-tab="products">Products &amp; prices</button>
    <button data-tab="site">Contact details</button>
    <button data-tab="other">Other text</button>
    <button data-tab="json" class="adv-only">Raw files (advanced)</button>
  </div>
  <div class="wrap" id="tab-host"></div>
  <div class="adv-link">Need technical options? <a id="adv-toggle">Show advanced settings</a></div>
</div>

<div id="msg"></div>

<script>
(function () {
  'use strict';
  var API = '/.netlify/functions/admin';
  var state = { files: null, shas: null, dirty: false, originals: null };
  var tab = 'home';
  var pw = sessionStorage.getItem('acpw') || '';
  var advanced = sessionStorage.getItem('acadv') === '1';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var msgTimer = null;
  function msg(text, isErr, ms) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { m.className = ''; }, isErr ? 6000 : (ms || 4000));
  }
  function markDirty() {
    if (state.dirty) return;
    state.dirty = true;
    $('dirty-chip').classList.add('show');
  }
  function clearDirty() {
    state.dirty = false;
    $('dirty-chip').classList.remove('show');
  }
  function saveMainEl() {
    var has = false;
    if (state.files && state.originals) {
      try { has = Object.keys(changedFiles()).length > 0; } catch (e) { has = false; }
    }
    var b = $('save-main');
    b.disabled = !has;
    b.textContent = 'Save changes' + (has ? ' ●' : '');
    state.dirty = has;
    $('dirty-chip').classList.toggle('show', has);
  }
  if (advanced) document.body.classList.add('advanced');
  $('adv-toggle').onclick = function () {
    advanced = !advanced;
    document.body.classList.toggle('advanced', advanced);
    sessionStorage.setItem('acadv', advanced ? '1' : '0');
    renderTab();
  };

  // ---------- friendly labels ----------
  var GLOBAL = {
    h1: 'Main headline', h1Em: 'Green highlight part (rarely needed)', lead: 'Intro paragraph under the headline',
    eyebrow: 'Small label above the headline', trust: 'Trust points (one per line)',
    float1: 'Floating card 1', float2: 'Floating card 2', title: 'Heading', sub: 'Small line under the title',
    text: 'Details', icon: 'Icon (choose from the list)',
    h2: 'Heading', kicker: 'Small label above heading', p: 'Text', p1: 'Text', p2: 'Text',
    btn: 'Button text', orderWa: '“Order on WhatsApp” button',
    shortName: 'Short name', tagline: 'Short tagline (used in browser titles)',
    whatsapp: 'WhatsApp number', phoneDisplay: 'Phone number shown on the site',
    phoneHref: 'Phone number for call links', email: 'Email address', address: 'Address', hours: 'Opening hours',
    name: 'Name', short: 'Short description', pack: 'Size / pack', price: 'Price (Rs.)',
    badge: 'Tag on the card', featured: 'Show on home page', description: 'Key benefits (one per line)',
    crops: 'Good for crops (separate with commas)', image: 'Product photo', slug: 'Web address name (advanced)',
    category: 'Category', note: 'Small note at the bottom of product pages', searchPlaceholder: 'Search box hint',
    currency: 'Rupees symbol', all: '“All” option', per: 'Word “per”', perPack: 'Text after the price',
    details: '“Details” button', order: '“Order” button', viewAll: '“View all products” button',
    productsLabel: 'Word “products”', empty: 'Message when nothing is found',
    resultsAll: 'Line above the product list (all)', resultsCat: 'Line above the product list (filtered)',
    resultsSearch: 'Line above the product list (searching)',
    disclaimer: 'Small line at the bottom of the site'
  };
  var SECTION = {
    nav: { home: 'Menu: Home', products: 'Menu: Products', about: 'Menu: About Us', contact: 'Menu: Contact', orderWa: 'Menu button “Order on WhatsApp”' },
    ui: {},
    home: {
      catKicker: 'Category heading label', catH2: 'Category heading', catP: 'Category intro text',
      bestKicker: 'Best-seller label', bestH2: 'Best-seller heading', bestP: 'Best-seller intro text',
      whyKicker: '“Why us” label', whyH2: '“Why us” heading', whyP: '“Why us” intro text', whyCta: '“Why us” link text',
      whyItems: 'Reasons customers choose us', stepsKicker: 'Ordering steps label', stepsH2: 'Ordering steps heading',
      stepsP: 'Ordering steps intro', stepsItems: 'The 3 ordering steps', ctaH2: 'Bottom banner heading',
      ctaP: 'Bottom banner text', ctaBtn: 'Bottom banner button'
    },
    productsPage: { heroP: 'Intro text at the top of the products page' },
    productPage: {
      benefits: 'Heading: Key benefits', crops: 'Heading: Suitable for', related: 'Heading: You may also like',
      callToOrder: '“Call to order” button', orderWa: '“Order on WhatsApp” button', note: 'Small note on product pages'
    },
    aboutPage: {
      heroP: 'Intro text at the top of the About page', kicker: 'Small label', h2: 'Heading',
      paras: 'Paragraphs (each line = one paragraph)', visionH: 'Panel heading “Vision & Mission”',
      visionP: 'Vision & mission text', ambitionH: 'Panel heading “Our Ambition”', ambitionP: 'Ambition text',
      supplyKicker: '“What we supply” label', supplyH2: '“What we supply” heading', supplyP1: 'First paragraph', supplyP2: 'Second paragraph',
      values: 'Company values', ctaH2: 'Bottom banner heading', ctaP: 'Bottom banner text', ctaBtn: 'Bottom banner button'
    },
    contactPage: {
      heroP: 'Intro text at the top of the contact page', callLabel: 'Card: Call us', waLabel: 'Card: WhatsApp',
      emailLabel: 'Card: Email', officeLabel: 'Card: Office address', hoursLabel: 'Card: Opening hours',
      waChat: 'Chat link text', formH: 'Form heading', formP: 'Form intro text', formBtn: 'Form button',
      formNotePrefix: 'Small text under the form (before the email)'
    },
    footer: { blurb: 'About text in the footer', quickLinks: 'Footer column: Quick links', range: 'Footer column: Product range', contactH: 'Footer column: Get in touch', whatsappUs: 'WhatsApp link text' }
  };
  function human(key) { return GLOBAL[key] || key.replace(/([A-Z])/g, ' $1').replace(/^./, function (c) { return c.toUpperCase(); }); }
  function humanIn(sectionKey, key) {
    var s = SECTION[sectionKey];
    if (s && s[key]) return s[key];
    return human(key);
  }
  var ITEM_LABEL = { whyItems: 'Reason', stepsItems: 'Step', values: 'Value', pillars: 'Value' };
  function itemName(arrayKey, i) {
    var base = ITEM_LABEL[arrayKey] || 'Item';
    return base + ' ' + (i + 1);
  }

  // ---------- helpers ----------
  function api(body) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ password: pw }, body))
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'Something went wrong (code ' + r.status + ')' }; });
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function getPath(obj, path) {
    var cur = obj;
    if (!path) return cur;
    path.split('.').forEach(function (p) { cur = cur == null ? undefined : cur[/^\d+$/.test(p) ? parseInt(p, 10) : p]; });
    return cur;
  }
  function setPath(obj, path, val) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) cur = cur[/^\d+$/.test(parts[i]) ? parseInt(parts[i], 10) : parts[i]];
    var last = /^\d+$/.test(parts[parts.length - 1]) ? parseInt(parts[parts.length - 1], 10) : parts[parts.length - 1];
    cur[last] = val;
  }
  function slugify(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
  var ICONS = ['check', 'sprout', 'pin', 'chat', 'truck', 'leaf', 'phone', 'mail', 'clock'];
  var LONG_KEYS = ['lead', 'paras', 'supplyP1', 'supplyP2', 'visionP', 'ambitionP', 'heroP', 'bestP', 'catP', 'whyP', 'stepsP', 'ctaP', 'blurb', 'formP', 'searchPlaceholder', 'note', 'h1', 'short', 'text', 'p1', 'p2'];

  // ---------- unlock ----------
  function unlock() {
    var input = $('pw').value;
    if (!input) { msg('Please type the password first', true); return; }
    pw = input;
    api({ action: 'state' }).then(function (res) {
      if (!res.ok) { msg('That password is not correct. Please try again.', true); pw = ''; return; }
      sessionStorage.setItem('acpw', pw);
      state.files = res.files;
      state.shas = res.shas;
      snap();
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      renderTab();
      msg('Welcome! You can change anything below.');
    });
  }

  // ---------- text editor ----------
  function iconOptions(sel) {
    return ICONS.map(function (i) { return '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + i + '</option>'; }).join('');
  }
  function fieldHtml(sectionKey, key, val, path) {
    var id = 'f-' + esc(path);
    var out = '<div class="field"><label for="' + id + '">' + humanIn(sectionKey, key) + '</label>';
    if (key === 'icon' && typeof val === 'string') {
      out += '<select id="' + id + '" data-path="' + esc(path) + '">' + iconOptions(val) + '</select>';
    } else if (typeof val === 'boolean') {
      out += '<span class="check"><input type="checkbox" id="' + id + '" data-path="' + esc(path) + '" data-type="bool"' + (val ? ' checked' : '') + '><span>' + (key === 'featured' ? 'Show this product in the home-page “Best sellers” row' : 'Yes') + '</span></span>';
    } else if (typeof val === 'number') {
      out += '<input type="number" id="' + id + '" data-path="' + esc(path) + '" data-type="num" value="' + esc(val) + '">';
    } else if (typeof val === 'string') {
      if (val.length > 90 || LONG_KEYS.indexOf(key) !== -1) {
        out += '<textarea rows="' + (key === 'paras' ? 6 : key === 'text' || key === 'short' || key === 'h1' || key === 'note' ? 2 : 3) + '" id="' + id + '" data-path="' + esc(path) + '">' + esc(val) + '</textarea>';
      } else {
        out += '<input type="text" id="' + id + '" data-path="' + esc(path) + '" value="' + esc(val) + '">';
      }
    } else {
      out += '<input type="text" disabled value="(use advanced settings)" title="Advanced field">';
    }
    out += '</div>';
    return out;
  }

  function renderSection(sectionKey, hideHeading) {
    var obj = state.files.content[sectionKey];
    if (!obj) return '';
    var html = '<div class="panel">' + (hideHeading ? '' : '<h2>' + esc(hideHeading || human(sectionKey)) + '</h2>');
    (function walk(o, path, parentKey) {
      Object.keys(o).forEach(function (k) {
        // the home headline is edited as one friendly field above
        if (sectionKey === 'home' && path === 'home' && (k === 'h1' || k === 'h1Em')) return;
        var v = o[k];
        var p = path ? path + '.' + k : k;
        if (Array.isArray(v)) {
          if (!v.length || typeof v[0] !== 'object') {
            html += '<div class="field"><label>' + humanIn(sectionKey, k) + ' <span class="hint">one per line</span></label>' +
              '<textarea rows="' + Math.min(v.length + 1, 7) + '" data-path="' + esc(p) + '" data-type="lines">' + esc(v.join('\n')) + '</textarea></div>';
          } else {
            html += '<div class="group"><h3><span class="gdot"></span>' + humanIn(sectionKey, k) + '</h3>';
            v.forEach(function (item, i) {
              html += '<div class="group"><h3>' + esc(itemName(k, i)) +
                ' <button type="button" class="btn red small" data-del="' + esc(p) + '.' + i + '" style="margin-left:auto">Remove</button></h3>';
              Object.keys(item).forEach(function (ik) { html += fieldHtml(sectionKey, ik, item[ik], p + '.' + i + '.' + ik); });
              html += '</div>';
            });
            html += '<button type="button" class="btn ghost small" data-add="' + esc(p) + '">+ Add another</button></div>';
          }
        } else if (v !== null && typeof v === 'object') {
          html += '<div class="group"><h3><span class="gdot"></span>' + humanIn(sectionKey, k) + '</h3>';
          walk(v, p, k);
          html += '</div>';
        } else {
          html += fieldHtml(sectionKey, k, v, p);
        }
      });
    })(obj, sectionKey);
    html += '</div>';
    return html;
  }

  var TAB_INFO = {
    home: ['Home page', 'These are the main texts visitors see first.'],
    about: ['About page', 'Your company story, vision and values.'],
    products: ['Products & prices', ''],
    site: ['Contact details', 'Your phone number, WhatsApp, email and address. These appear at the top and bottom of every page and on the contact page.'],
    other: ['Other text', 'Menu words, buttons and smaller texts. Only change these if something looks wrong on the site.'],
    json: ['Raw files (advanced)', 'Full control over the saved files. Be careful — everything here is checked before saving.']
  };
  function renderTextTab(tabName) {
    var info = TAB_INFO[tabName];
    var html = '<div class="howto"><b>1.</b> Change any text below &nbsp;·&nbsp; <b>2.</b> Press <b>“Save changes”</b> at the top &nbsp;·&nbsp; your website updates in about one minute.</div>';
    html += '<div class="panel"><h2>' + info[0] + '</h2><p class="desc">' + info[1] + '</p></div>';
    if (tabName === 'home') {
      // friendly single headline field (merges h1 + h1Em into one)
      var obj = state.files.content.home;
      var combined = (obj.h1 || '') + (obj.h1Em || '');
      html += '<div class="panel"><div class="field"><label for="f-headline">Main headline</label>' +
        '<textarea rows="2" id="f-headline" data-headline="1">' + esc(combined) + '</textarea>' +
        '<span class="hint">Shown in large letters at the very top of the home page.</span></div></div>';
      html += renderSection('home');
    } else if (tabName === 'other') {
      html += renderSection('nav', 'Menu (top of the site)');
      html += renderSection('ui', 'Small buttons &amp; labels');
      html += renderSection('productsPage', 'Products page (the list of all products)');
      html += renderSection('productPage', 'Product pages (when you open one product)');
      html += renderSection('contactPage', 'Contact page');
      html += renderSection('footer', 'Footer (bottom of every page)');
    } else {
      html += renderSection(tabName);
    }
    $('tab-host').innerHTML = html;
    bindTextEvents(tabName);
  }

  function bindTextEvents(tabName) {
    var root = $('tab-host');
    root.querySelectorAll('[data-path]').forEach(function (el) {
      el.addEventListener('change', function () {
        var val;
        if (el.dataset.type === 'num') val = parseFloat(el.value) || 0;
        else if (el.dataset.type === 'bool') val = el.checked;
        else if (el.dataset.type === 'lines') val = el.value.split('\n').map(function (s) { return s.replace(/\r$/, ''); });
        else val = el.value;
        setPath(state.files.content, el.dataset.path, val);
        markDirty();
        saveMainEl();
      });
    });
    root.querySelectorAll('[data-add]').forEach(function (el) {
      el.addEventListener('click', function () {
        var arr = getPath(state.files.content, el.dataset.add);
        if (arr && arr.length) {
          var tpl = {};
          Object.keys(arr[0]).forEach(function (k) {
            var v = arr[0][k];
            tpl[k] = typeof v === 'string' ? '' : Array.isArray(v) ? [] : typeof v === 'number' ? 0 : false;
          });
          arr.push(tpl);
        }
        markDirty(); saveMainEl(); renderTab();
      });
    });
    root.querySelectorAll('[data-del]').forEach(function (el) {
      el.addEventListener('click', function () {
        var parts = el.dataset.del.split('.');
        var idx = parseInt(parts.pop(), 10);
        var arr = getPath(state.files.content, parts.join('.'));
        if (arr && arr.length) arr.splice(idx, 1);
        markDirty(); saveMainEl(); renderTab();
      });
    });
    var headline = $('f-headline');
    if (headline) {
      headline.addEventListener('change', function () {
        state.files.content.home.h1 = headline.value;
        state.files.content.home.h1Em = ''; // one clean headline, no separate accent
        markDirty();
        saveMainEl();
      });
    }
  }

  // ---------- saving (saves everything you changed, in one click) ----------
  function snap() { state.originals = clone(state.files); }
  function changedFiles() {
    var out = {};
    ['content', 'products', 'site'].forEach(function (k) {
      var a = state.files[k];
      var b = state.originals && state.originals[k];
      if (a && b && JSON.stringify(a) !== JSON.stringify(b)) out['src/data/' + k + '.json'] = a;
    });
    return out;
  }
  function saveChanges() {
    var files = changedFiles();
    if (!Object.keys(files).length) {
      msg('Nothing to save yet — make a change first.', false, 2500);
      return;
    }
    var btn = $('save-main');
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = 'Saving…';
    msg('Saving your changes…');
    api({ action: 'save', files: files, shas: state.shas }).then(function (res) {
      btn.disabled = !state.dirty;
      btn.textContent = old;
      if (!res.ok) return msg(res.error || 'Save failed. Please try again.', true);
      if (res.shas) state.shas = res.shas;
      snap();
      clearDirty();
      saveMainEl();
      msg('✓ Saved. Your website will update in about one minute.');
    });
  }

  // ---------- image upload ----------
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type)) return reject(new Error('Please choose an image file'));
      if (file.size > 12 * 1024 * 1024) return reject(new Error('Photo is too big (max 12 MB)'));
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read the file')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('That file is not a valid image')); };
        img.onload = function () {
          var MAX = 1400;
          var ratio = Math.min(1, MAX / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var q = 0.84;
          var dataUrl = canvas.toDataURL('image/jpeg', q);
          while (dataUrl.length > 1.6e6 && q > 0.5) { q -= 0.08; dataUrl = canvas.toDataURL('image/jpeg', q); }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function uploadImage(file, baseName, oldImagePath) {
    msg('Uploading photo…');
    return compressImage(file).then(function (dataUrl) {
      var name = slugify(baseName || 'product') + '.jpg';
      var removeOld = '';
      var m = oldImagePath ? /([a-z0-9][a-z0-9-]*\.(?:png|jpe?g|webp))$/i.exec(oldImagePath) : null;
      if (m && m[1] !== name) removeOld = m[1];
      return api({ action: 'image', name: name, data: dataUrl.split(',')[1] }).then(function (res) {
        if (!res.ok) throw new Error(res.error || 'Upload failed');
        if (removeOld) api({ action: 'image', name: removeOld, remove: true }).catch(function () {});
        msg('Photo added ✓ — press “Save changes” when you finish editing');
        return res.path;
      });
    });
  }

  // ---------- products ----------
  function thumbHtml(p) {
    if (p.image) return '<img class="thumb" src="' + esc(p.image) + '" alt="">';
    return '<span class="thumb-ph">' + esc((p.name || '?').charAt(0).toUpperCase()) + '</span>';
  }
  function renderProductsTab() {
    var f = state.files.products;
    var html = '<div class="howto"><b>1.</b> Press <b>“Add product”</b> or <b>Edit</b> &nbsp;·&nbsp; <b>2.</b> Fill the form (photo optional) &nbsp;·&nbsp; <b>3.</b> Press <b>“Save changes”</b> at the top — the website updates in about one minute.</div>';
    html += '<div class="panel"><h2>Your products (' + f.products.length + ')</h2>' +
      '<p class="desc">A photo is optional — products without one still look good with automatic artwork.</p>' +
      '<button class="btn blue" id="new-product">+ Add a new product</button></div>';
    html += '<div class="panel"><h2>Products</h2>';
    if (!f.products.length) html += '<p class="muted">No products yet — press “Add a new product”.</p>';
    f.products.forEach(function (p, i) {
      html += '<div class="row">' + thumbHtml(p) +
        '<div class="name">' + esc(p.name) +
        '<span class="sub">' + esc(p.pack) + ' · Rs. ' + esc(p.price) +
        (p.featured ? ' · shown on home page' : '') + (p.badge ? ' · ' + esc(p.badge) : '') + '</span></div>' +
        '<div class="acts"><button class="btn small ghost" data-edit="' + i + '">Edit</button>' +
        '<button class="btn small red" data-delp="' + i + '">Delete</button></div></div>';
    });
    html += '</div>';
    html += '<div class="panel"><h2>Product categories</h2><p class="desc">Used to group products on the website (e.g. Fungicides, Seeds). You can add a new one below.</p>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">';
    f.categories.forEach(function (c, i) {
      html += '<span class="chip">' + esc(c.name) +
        ' <a href="#" data-cat-del="' + i + '" title="Remove this category">×</a></span>';
    });
    html += '</div><div style="display:flex;gap:8px;max-width:420px">' +
      '<input id="new-cat-name" placeholder="New category name, e.g. Herbicides">' +
      '<button class="btn ghost" id="add-cat">Add category</button></div></div>';
    $('tab-host').innerHTML = html;

    $('new-product').onclick = function () { productEditor(null); };
    $('add-cat').onclick = function () {
      var name = $('new-cat-name').value.trim();
      if (!name) return msg('Please type the new category name first', true);
      var slug = slugify(name);
      if (f.categories.some(function (c) { return c.slug === slug; })) return msg('That category already exists', true);
      f.categories.push({ slug: slug, name: name });
      markDirty(); saveMainEl(); renderProductsTab();
    };
    $('tab-host').querySelectorAll('[data-cat-del]').forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var i = parseInt(a.dataset.catDel, 10);
        var inUse = f.products.some(function (p) { return p.category === f.categories[i].slug; });
        if (inUse) return msg('Some products use this category — move or delete them first', true);
        f.categories.splice(i, 1);
        markDirty(); saveMainEl(); renderProductsTab();
      };
    });
    $('tab-host').querySelectorAll('[data-edit]').forEach(function (b) {
      b.onclick = function () { productEditor(parseInt(b.dataset.edit, 10)); };
    });
    $('tab-host').querySelectorAll('[data-delp]').forEach(function (b) {
      b.onclick = function () {
        var i = parseInt(b.dataset.delp, 10);
        var p = f.products[i];
        if (!confirm('Delete “' + p.name + '”? Press “Save changes” to finish.')) return;
        if (p.image) {
          var m = /([a-z0-9][a-z0-9-]*\.(?:png|jpe?g|webp))$/i.exec(p.image);
          if (m) api({ action: 'image', name: m[1], remove: true }).catch(function () {});
        }
        f.products.splice(i, 1);
        markDirty(); saveMainEl(); renderProductsTab();
      };
    });
  }

  function productEditor(idx) {
    var f = state.files.products;
    var isNew = idx == null;
    var draft = isNew
      ? { slug: '', name: '', category: f.categories[0].slug, pack: '', price: 0, badge: '', featured: false, short: '', description: [''], crops: [], image: null }
      : clone(f.products[idx]);
    var catOptions = f.categories.map(function (c) {
      return '<option value="' + esc(c.slug) + '"' + (c.slug === draft.category ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');
    var preview = draft.image
      ? '<img id="img-preview" src="' + esc(draft.image) + '" alt="Product photo">'
      : '<p class="muted" style="margin:0 0 12px">No photo yet — the website will use automatic artwork.</p>';
    var slugField = advanced
      ? '<div class="field adv-only"><label>Web address (advanced — leave empty to auto-create)</label><input id="ed-slug" value="' + esc(draft.slug) + '"></div>'
      : '';
    var html = '<div class="panel"><h2>' + (isNew ? 'Add a new product' : 'Edit — ' + esc(draft.name)) + '</h2>';
    html += '<div class="grid3">' +
      '<div class="field" style="grid-column:1/-1"><label>Product name *</label><input id="ed-name" value="' + esc(draft.name) + '"><span class="hint">Exactly as it should appear on the website.</span></div>' +
      '<div class="field"><label>Category</label><select id="ed-cat">' + catOptions + '</select></div>' +
      '<div class="field"><label>Size / pack</label><input id="ed-pack" value="' + esc(draft.pack) + '" placeholder="e.g. 250 ml bottle"><span class="hint">e.g. 250 ml bottle, 50 kg bag</span></div>' +
      '<div class="field"><label>Price in rupees (Rs.)</label><input id="ed-price" type="number" min="0" step="1" value="' + esc(draft.price) + '"></div>' +
      '<div class="field"><label>Tag on the card (optional)</label><select id="ed-badge"><option value="">No tag</option>' +
      '<option' + (draft.badge === 'Hot' ? ' selected' : '') + '>Hot</option>' +
      '<option' + (draft.badge === 'Best Seller' ? ' selected' : '') + '>Best Seller</option></select></div>' +
      '<div class="field"><label>Short description</label><textarea id="ed-short" rows="2" placeholder="One sentence about what this product does.">' + esc(draft.short) + '</textarea></div>' +
      slugField +
      '</div>' +
      '<span class="check"><input id="ed-feat" type="checkbox"' + (draft.featured ? ' checked' : '') + '><span>Show this product in the “Best sellers” row on the home page</span></span>' +
      '<div class="field"><label>Key benefits <span class="hint">one benefit per line</span></label><textarea id="ed-desc" rows="4">' + esc((draft.description || []).join('\n')) + '</textarea></div>' +
      '<div class="field"><label>Good for these crops <span class="hint">separate with commas — e.g. Wheat, Rice, Cotton</span></label><input id="ed-crops" value="' + esc((draft.crops || []).join(', ')) + '"></div>' +
      '<div class="group"><h3><span class="gdot"></span>Product photo <span class="note-pill" style="margin-left:auto">optional</span></h3><div class="upbox" id="upbox">' + preview +
      '<button class="btn ghost small" id="btn-choose">Choose photo…</button>' +
      (draft.image ? ' <button class="btn red small" id="btn-remove-img">Remove photo</button>' : '') +
      '<input type="file" id="file-img" accept="image/*" class="hidden">' +
      '<span class="muted">Photos are made smaller automatically, so phone photos are fine.</span></div></div>' +
      '<div style="display:flex;gap:10px;margin-top:8px"><button class="btn blue" id="ed-done">' + (isNew ? 'Add this product' : 'Done editing') + '</button>' +
      '<button class="btn ghost" id="ed-cancel">Cancel</button>' +
      '<span class="muted" style="align-self:center">Then press “Save changes” at the top.</span></div></div>';
    $('tab-host').innerHTML = html;

    function wirePhoto() {
      var up = $('upbox');
      if (!up) return;
      var chooseBtn = up.querySelector('#btn-choose');
      var fileInput = up.querySelector('#file-img');
      if (chooseBtn) chooseBtn.onclick = function () { fileInput.click(); };
      if (fileInput) fileInput.onchange = function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        var baseName = draft.slug || slugify($('ed-name').value.trim() || 'product');
        uploadImage(file, baseName, draft.image).then(function (path) {
          draft.image = path;
          var pv = up.querySelector('#img-preview');
          if (pv) pv.src = path;
          markDirty(); saveMainEl();
        }).catch(function (e) { msg(e.message || 'Upload failed', true); });
      };
      var remBtn = up.querySelector('#btn-remove-img');
      if (remBtn) remBtn.onclick = function () {
        var m = draft.image ? /([a-z0-9][a-z0-9-]*\.(?:png|jpe?g|webp))$/i.exec(draft.image) : null;
        if (m) api({ action: 'image', name: m[1], remove: true }).catch(function () {});
        draft.image = null;
        up.innerHTML = '<p class="muted" style="margin:0 0 12px">No photo yet — the website will use automatic artwork.</p>' +
          '<button class="btn ghost small" id="btn-choose">Choose photo…</button>' +
          '<input type="file" id="file-img" accept="image/*" class="hidden">' +
          '<span class="muted">Photos are made smaller automatically, so phone photos are fine.</span>';
        wirePhoto();
        markDirty(); saveMainEl();
      };
    }
    wirePhoto();

    $('ed-done').onclick = function () {
      var name = $('ed-name').value.trim();
      if (!name) return msg('Please type the product name first', true);
      var slug;
      if (advanced && $('ed-slug')) {
        slug = $('ed-slug').value.trim() || slugify(name);
      } else {
        slug = isNew ? slugify(name) : (draft.slug || slugify(name));
      }
      // make sure the web address is unique
      var base = slug; var n = 2;
      while (f.products.some(function (p, j) { return j !== idx && p.slug === slug; })) { slug = base + '-' + n; n++; }
      var obj = {
        slug: slug,
        name: name,
        category: $('ed-cat').value,
        pack: $('ed-pack').value.trim(),
        price: parseFloat($('ed-price').value) || 0,
        badge: $('ed-badge').value || null,
        featured: $('ed-feat').checked,
        short: $('ed-short').value.trim(),
        description: $('ed-desc').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean),
        crops: $('ed-crops').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        image: draft.image
      };
      if (isNew) f.products.push(obj); else f.products[idx] = obj;
      markDirty(); saveMainEl();
      renderProductsTab();
      msg('Product saved. Press “Save changes” at the top to put it live.');
    };
    $('ed-cancel').onclick = function () { renderProductsTab(); };
  }

  // ---------- contact details ----------
  function renderSiteTab() {
    var s = state.files.site;
    var fields = [
      ['name', 'Business name'],
      ['whatsapp', 'WhatsApp number', 'Only numbers, starting with 92 — e.g. 923245764838'],
      ['phoneDisplay', 'Phone number shown on the site', 'e.g. +92 324 5764838'],
      ['email', 'Email address'],
      ['address', 'Address'],
      ['hours', 'Opening hours', 'e.g. Mon – Sat: 9:00 AM – 7:00 PM'],
      ['tagline', 'Short tagline', 'e.g. Crop Protection & Seeds']
    ];
    var html = '<div class="howto"><b>1.</b> Change any detail &nbsp;·&nbsp; <b>2.</b> Press <b>“Save changes”</b> — the website updates in about one minute.</div>';
    html += '<div class="panel"><h2>Contact details &amp; company info</h2><p class="desc">These appear at the top, bottom and on the contact page of your website. WhatsApp orders go to the number you enter here.</p><div class="grid2">';
    fields.forEach(function (fld) {
      var key = fld[0];
      html += '<div class="field"><label>' + fld[1] + '</label>' +
        (fld[2] ? '<span class="hint">' + fld[2] + '</span>' : '') +
        '<input id="site-' + key + '" value="' + esc(s[key] == null ? '' : s[key]) + '"></div>';
    });
    html += '</div><p class="muted" style="margin-top:4px">Tip: WhatsApp order buttons and click-to-call links update automatically from these numbers.</p></div>';
    $('tab-host').innerHTML = html;
    fields.forEach(function (fld) {
      $('site-' + fld[0]).addEventListener('change', function () {
        state.files.site[fld[0]] = $('site-' + fld[0]).value.trim();
        markDirty(); saveMainEl();
      });
    });
  }

  // ---------- raw JSON (advanced) ----------
  function renderJsonTab() {
    var html = '<div class="panel"><h2>Raw files (advanced)</h2><p class="desc">Full control for technical users. Invalid content is refused before saving.</p>' +
      '<div class="field"><label>File</label><select id="raw-file">' +
      '<option value="content">content.json — all website text</option>' +
      '<option value="products">products.json — products</option>' +
      '<option value="site">site.json — contact details</option></select></div>' +
      '<div class="field"><label>Content</label><textarea id="raw-body" rows="24"></textarea></div>' +
      '<div style="display:flex;gap:8px"><button class="btn ghost" id="raw-validate">Check</button>' +
      '<button class="btn" id="raw-save">Save this file</button></div></div>';
    $('tab-host').innerHTML = html;
    var sel = $('raw-file');
    function show() { $('raw-body').value = JSON.stringify(state.files[sel.value], null, 2); }
    sel.onchange = show;
    show();
    $('raw-validate').onclick = function () {
      try {
        var parsed = JSON.parse($('raw-body').value);
        if (sel.value === 'products' && (!parsed.products || !Array.isArray(parsed.products))) throw new Error('needs { products: [...] }');
        msg('The file is valid ✓');
      } catch (e) { msg('Not valid: ' + e.message, true); }
    };
    $('raw-save').onclick = function () {
      try {
        var parsed = JSON.parse($('raw-body').value);
        if (sel.value === 'products' && (!parsed.products || !Array.isArray(parsed.products))) throw new Error('needs { products: [...] }');
        state.files[sel.value] = parsed;
        markDirty();
        saveMainEl();
        saveChanges();
      } catch (e) { msg('Not valid: ' + e.message, true); }
    };
  }

  // ---------- tab switching ----------
  function renderTab() {
    var host = $('tab-host');
    if (!host) return;
    if (tab === 'home') renderTextTab('home');
    else if (tab === 'about') renderTextTab('about');
    else if (tab === 'products') renderProductsTab();
    else if (tab === 'site') renderSiteTab();
    else if (tab === 'other') renderTextTab('other');
    else if (tab === 'json') renderJsonTab();
    saveMainEl();
  }
  function switchTab(next) {
    tab = next;
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.tab === next);
    });
    renderTab();
  }

  // ---------- events ----------
  $('unlock').onclick = unlock;
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.onclick = function () { switchTab(b.dataset.tab); };
  });
  $('save-main').onclick = saveChanges;
  $('btn-reload').onclick = function () {
    if (state.dirty && !confirm('Discard your unsaved changes?')) return;
    api({ action: 'state' }).then(function (res) {
      if (!res.ok) return msg(res.error || 'Reload failed', true);
      state.files = res.files;
      state.shas = res.shas;
      snap();
      clearDirty();
      saveMainEl();
      renderTab();
      msg('Reloaded the latest version.');
    });
  };
  $('btn-logout').onclick = function () {
    sessionStorage.removeItem('acpw');
    location.reload();
  };

  if (pw) {
    api({ action: 'state' }).then(function (res) {
      if (res.ok) {
        state.files = res.files;
        state.shas = res.shas;
        snap();
        $('login').classList.add('hidden');
        $('app').classList.remove('hidden');
        renderTab();
        msg('Welcome back.');
      } else {
        sessionStorage.removeItem('acpw');
        pw = '';
      }
    });
  }
})();
</script>
